name: Run Unit Tests
on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        id: run_tests
        run: ./gradlew test --continue
        continue-on-error: true

      - name: Summarize results
        if: always()
        run: |
          total=0
          failed=0
          skipped=0

          for f in $(find app/build/test-results -name "TEST-*.xml" 2>/dev/null); do
            class=$(basename "$f" .xml | sed 's/TEST-//')
            t=$(grep -oPm1 '(?<=tests=")[^"]+' "$f")
            fail=$(grep -oPm1 '(?<=failures=")[^"]+' "$f")
            skip=$(grep -oPm1 '(?<=skipped=")[^"]+' "$f")
            time=$(grep -oPm1 '(?<=time=")[^"]+' "$f")

            echo "$class: $t tests, $fail failed, $skip skipped, ${time}s"

            total=$((total + t))
            failed=$((failed + fail))
            skipped=$((skipped + skip))
          done

          echo ""
          echo "Total: $total tests, $failed failed, $skipped skipped"
          echo "total=$total" >> $GITHUB_ENV
          echo "failed=$failed" >> $GITHUB_ENV

      - name: Show failure details
        if: always() && env.failed != '0'
        run: |
          for f in $(find app/build/test-results -name "TEST-*.xml" 2>/dev/null); do
            if grep -q 'failures="[1-9]' "$f"; then
              echo "--- $(basename "$f") ---"
              grep -A 20 '<failure' "$f" || true
            fi
          done

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 30

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-html
          path: app/build/reports/tests/testDebugUnitTest/index.html
          retention-days: 30

      - name: Fail if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
